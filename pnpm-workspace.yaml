packages:
  # 根包本身也是可发布包，必须列进来，否则 changesets 认为它“不在 workspace 中”
  - .
  - demo

allowBuilds:
  '@swc/core': true
  esbuild: true
  simple-git-hooks: true
  workerd: true
minimumReleaseAgeExclude:
  - miniflare@5.20261104.0-beta
  - wrangler@4.158.0
  - '@weapp-core/constants@0.6.1'
  - '@weapp-core/shared@3.5.1'
  - '@weapp-vite/ast@7.11.1'
  - '@weapp-vite/eslint@0.3.5'
  - '@weapp-vite/wxml@0.0.3'
  - '@wevu/compiler@7.11.1'
  - '@wevu/test-utils@1.1.6'
  - rolldown-require@2.1.5
  - '@mpcore/simulator@1.3.5'
  - '@mpcore/test@1.2.6'
  - '@mpcore/vitest@1.2.6'
onlyBuiltDependencies:
  - esbuild
